name: Build Nepnote

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Tauri CLI
        run: npm install

      - name: Build
        run: npx tauri build

      - name: Collect files
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force out | Out-Null
          Copy-Item src-tauri/target/release/nepnote.exe out/Nepnote.exe
          Copy-Item src-tauri/target/release/bundle/nsis/*.exe out/

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: Nepnote-windows
          path: out/

      - name: Read version
        id: ver
        shell: pwsh
        run: |
          $v = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          "version=$v" >> $env:GITHUB_OUTPUT

      - name: Publish release
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: Nepnote ${{ steps.ver.outputs.version }}
          make_latest: true
          overwrite_files: true
          files: out/*
          body: |
            **Nepnote ${{ steps.ver.outputs.version }}**: a notes overlay for your games. Press Shift+F1 in a listed game to open your notes on top of it.

            **Which file?**
            - `Nepnote_${{ steps.ver.outputs.version }}_x64-setup.exe`: installer, adds Nepnote to your Start menu.
            - `Nepnote.exe`: portable, run it from any folder.

            **Getting started**
            1. Run Nepnote. A purple icon appears in the tray.
            2. Open a game and press **Ctrl+Shift+F1** to add it.
            3. Press **Shift+F1** to open your notes. Notes are saved in Documents\Nepnote.

            Windows SmartScreen may warn you because the app isn't signed: click **More info**, then **Run anyway**.

            **Anti-cheat safety:** Nepnote uses a standard hotkey only while a listed game is in front, never opens or touches the game, and pauses completely when anti-cheat is running. See the README for details.
