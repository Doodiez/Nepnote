<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Nepnote Pin</title>
<style>
:root {
  color-scheme: dark;
  --ov-bg: #17171d;
  --row-hover: #2b2b36;
  --line: #34343f;
  --accent: #8b7cf6;
  --accent-ink: #ffffff;
  --text: #ececf1;
  --title: #f2f2f7;
  --muted: #8a8a9c;
  --done: #6a6a7c;
  --font-ui: "Segoe UI", system-ui, sans-serif;
  --font-note: "Cascadia Mono", Consolas, ui-monospace, monospace;
  --ov-opacity: .96;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; background: transparent; overflow: hidden; font-family: var(--font-ui); color: var(--text); }
.card {
  width: 100%; background: var(--ov-bg); opacity: var(--ov-opacity); border: 1px solid var(--line); border-radius: 10px;
  display: grid; grid-template-rows: 34px auto; overflow: hidden;
}
.card[hidden] { display: none; }
.head { display: flex; align-items: center; gap: 8px; padding: 0 10px; border-bottom: 1px solid var(--line); min-width: 0; user-select: none; }
.unlocked .head { cursor: grab; }
.head svg { width: 13px; height: 13px; color: var(--accent); flex: none; }
.head b { font-size: 12.5px; font-weight: 600; color: var(--title); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; min-width: 0; }
.head small { font-size: 11px; color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
.body {
  max-height: 380px; overflow: hidden; padding: 8px 12px 10px; font-family: var(--font-note); font-size: 12.5px; line-height: 1.55;
  white-space: pre-wrap; overflow-wrap: anywhere;
}
.body ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 3px; white-space: normal; }
.body li { display: flex; gap: 8px; align-items: flex-start; }
.body li i { width: 13px; height: 13px; margin-top: 3px; flex: none; border: 1.5px solid var(--muted); border-radius: 3px; display: grid; place-items: center; }
.body li.done { color: var(--done); text-decoration: line-through; }
.body li.done i { background: var(--accent); border-color: var(--accent); }
.body li.done i::after { content: ""; width: 6px; height: 3px; border: 1.5px solid var(--accent-ink); border-top: 0; border-right: 0; transform: rotate(-45deg) translate(1px, -1px); }
.empty { color: var(--muted); font-family: var(--font-ui); }
.hint { display: none; font-size: 10.5px; color: var(--muted); padding: 0 12px 8px; font-family: var(--font-ui); }
.unlocked .hint { display: block; }
</style>
</head>
<body>
<div class="card" id="card" hidden>
  <div class="head" id="head">
    <svg viewBox="0 0 16 16" fill="currentColor"><path d="M10.2 1.3 14.7 5.8l-1.4.6-2.3 2.3.2 3.3-1.3 1.3-2.7-2.7L3 14.8l-1-1 4.2-4.2-2.7-2.7L4.8 5.6l3.3.2 2.3-2.3z"/></svg>
    <b id="name">Pinned</b><small id="prog"></small>
  </div>
  <div class="body" id="body"></div>
  <div class="hint">Drag the top bar to move. Lock it from the overlay so clicks go to your game.</div>
</div>
<script>
(() => {
  const invoke = window.__TAURI__.core.invoke;
  const { listen } = window.__TAURI__.event;
  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

  function parseList(text) {
    return text.split('\n').filter((l) => l.trim() !== '').map((l) => {
      const m = l.match(/^\s*\[( |x|X)\]\s?(.*)$/);
      if (m) return { done: m[1].toLowerCase() === 'x', text: m[2] };
      return { done: false, text: l.replace(/^\s*[-*•]\s+/, '') };
    });
  }
  async function readJSON(rel, fallback) {
    try { const t = await invoke('read_text', { rel }); return t.trim() ? JSON.parse(t) : fallback; }
    catch (e) { return fallback; }
  }

  let busy = false, again = false;
  async function refresh() {
    if (busy) { again = true; return; }
    busy = true;
    try {
      const info = await invoke('get_info');
      const settings = await readJSON('settings.json', {});
      document.documentElement.style.setProperty('--ov-opacity', String((typeof settings.opacity === 'number' ? settings.opacity : 96) / 100));
      const locked = !!settings.locked;
      document.body.classList.toggle('unlocked', !locked);
      const head = $('head');
      if (locked) head.removeAttribute('data-tauri-drag-region'); else head.setAttribute('data-tauri-drag-region', '');
      head.querySelectorAll('svg, b, small').forEach((el) => {
        if (locked) el.removeAttribute('data-tauri-drag-region'); else el.setAttribute('data-tauri-drag-region', '');
      });

      const card = $('card');
      if (!info.name) { card.hidden = true; return; }
      const meta = await readJSON(`${info.name}/.gamenotes.json`, {});
      if (!meta.pinned) { card.hidden = true; return; }
      const text = await invoke('read_text', { rel: meta.pinned });
      const title = meta.pinned.split('/').pop().replace(/\.txt$/i, '');
      $('name').textContent = title;
      if (meta.kinds && meta.kinds[meta.pinned] === 'list') {
        const items = parseList(text);
        const done = items.filter((x) => x.done).length;
        $('prog').textContent = `${done}/${items.length}`;
        $('body').innerHTML = items.length
          ? '<ul>' + items.map((it) => `<li class="${it.done ? 'done' : ''}"><i></i><span>${esc(it.text)}</span></li>`).join('') + '</ul>'
          : '<span class="empty">This checklist is empty.</span>';
      } else {
        $('prog').textContent = '';
        $('body').innerHTML = text.trim() ? esc(text) : '<span class="empty">This note is empty.</span>';
      }
      card.hidden = false;
      await new Promise((r) => requestAnimationFrame(r));
      await invoke('resize_pin', { height: Math.ceil(card.getBoundingClientRect().height) + 1 });
    } catch (e) {
      // keep the last good card on screen
    } finally {
      busy = false;
      if (again) { again = false; refresh(); }
    }
  }

  listen('pin-refresh', refresh);
  listen('settings-changed', refresh);
  document.addEventListener('contextmenu', (e) => e.preventDefault());
  refresh();
})();
</script>
</body>
</html>
